<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" fill="none">
  <title>Reward field: tonal veil, fading dot mesh and centered circular construction</title>
  <defs>
    <linearGradient id="shade" x2="0" y2="1"><stop stop-color="#000" stop-opacity="0"/><stop offset=".55" stop-color="#000" stop-opacity=".03"/><stop offset="1" stop-color="#000" stop-opacity=".24"/></linearGradient>
    <linearGradient id="upper-light" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".65"/><stop offset=".42" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="haze"><stop stop-color="#fff" stop-opacity=".38"/><stop offset=".6" stop-color="#fff" stop-opacity=".19"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="annulus"><stop offset=".40" stop-color="#fff" stop-opacity="0"/><stop offset=".43" stop-color="#fff" stop-opacity=".48"/><stop offset=".69" stop-color="#fff" stop-opacity=".24"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="core"><stop stop-color="#000" stop-opacity=".17"/><stop offset=".85" stop-color="#000" stop-opacity=".17"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="mesh-fade" x2="0" y2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".17" stop-color="#fff" stop-opacity=".16"/><stop offset=".38" stop-color="#fff"/><stop offset=".68" stop-color="#fff" stop-opacity=".8"/><stop offset=".95" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="mesh-mask"><rect width="600" height="300" fill="url(#mesh-fade)"/></mask>
    <pattern id="dots" width="4.5" height="4.5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".56" fill="#fff" fill-opacity=".76"/></pattern>
  </defs>
  <rect width="600" height="300" fill="url(#shade)"/>
  <circle cx="300" cy="153" r="58" fill="url(#core)"/>
  <g opacity=".085">
    <rect width="600" height="300" fill="url(#upper-light)"/>
    <ellipse cx="167" cy="85" rx="160" ry="230" fill="url(#haze)"/>
    <ellipse cx="440" cy="128" rx="145" ry="150" fill="url(#haze)" opacity=".62"/>
    <rect width="600" height="300" fill="url(#dots)" mask="url(#mesh-mask)"/>
    <circle cx="300" cy="153" r="130" fill="url(#annulus)"/>
    <path d="M190 43 228 81M372 225 410 263M190 263 228 225M372 81 410 43" stroke="#fff" stroke-opacity=".26" stroke-width=".8"/>
    <circle cx="300" cy="153" r="130" stroke="#fff" stroke-width="1.05"/>
  </g>
</svg>
