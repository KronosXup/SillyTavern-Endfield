<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Endfield reasoning motion preview</title>
    <style>
        :root {
            --ef-calib-m: #ff00d4;
            --ef-calib-y: #f6ff00;
            --ef-calib-c: #38f6c2;
        }

        @property --ef-reasoning-stop-a {
            syntax: "<percentage>";
            inherits: false;
            initial-value: 0%;
        }

        @property --ef-reasoning-stop-b {
            syntax: "<percentage>";
            inherits: false;
            initial-value: 70%;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            color: #101618;
            background: #edf0f0;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        }

        #chat {
            width: min(640px, calc(100vw - 32px));
        }

        .mes_block {
            padding: 28px 24px 40px;
            background: #fff;
        }

        .mes_reasoning_details {
            border: 0;
        }

        .mes_reasoning_summary {
            position: relative;
            display: block;
            min-height: 58px;
            padding: 18px 20px;
            overflow: hidden;
            border: 1px solid #cdd1d1;
            background: #f7f8f8;
            font-size: 18px;
            font-weight: 700;
            list-style: none;
        }

        .mes_reasoning_summary::after {
            content: "";
            position: absolute;
            z-index: 2;
            right: auto;
            bottom: 0;
            left: 0;
            width: 40%;
            height: 2px;
            pointer-events: none;
            --ef-reasoning-stop-a: 0%;
            --ef-reasoning-stop-b: 70%;
            --ef-reasoning-color-a: var(--ef-calib-c);
            --ef-reasoning-color-b: var(--ef-calib-m);
            --ef-reasoning-color-c: var(--ef-calib-y);
            background-image: linear-gradient(
                to right,
                var(--ef-reasoning-color-a) 0 var(--ef-reasoning-stop-a),
                var(--ef-reasoning-color-b) var(--ef-reasoning-stop-a) var(--ef-reasoning-stop-b),
                var(--ef-reasoning-color-c) var(--ef-reasoning-stop-b) 100%
            );
            background-repeat: no-repeat;
            background-position: 0 0;
            background-size: 100% 100%;
            opacity: 0;
        }

        body[data-generating="true"]
        #chat > .last_mes
        .mes_reasoning_details[data-state="thinking"] > .mes_reasoning_summary::after {
            animation: ef-reasoning-calibration-run 1800ms linear infinite;
        }

        @keyframes ef-reasoning-calibration-run {
            0% {
                --ef-reasoning-stop-a: 0%;
                --ef-reasoning-stop-b: 70%;
                --ef-reasoning-color-a: var(--ef-calib-c);
                --ef-reasoning-color-b: var(--ef-calib-m);
                --ef-reasoning-color-c: var(--ef-calib-y);
                animation-timing-function: cubic-bezier(0.25, 0.3, 0.65, 0.82);
                opacity: 0.92;
            }

            33.32% {
                --ef-reasoning-stop-a: 70%;
                --ef-reasoning-stop-b: 100%;
                --ef-reasoning-color-a: var(--ef-calib-c);
                --ef-reasoning-color-b: var(--ef-calib-m);
                --ef-reasoning-color-c: var(--ef-calib-y);
                animation-timing-function: steps(1, end);
                opacity: 0.92;
            }

            33.34% {
                --ef-reasoning-stop-a: 0%;
                --ef-reasoning-stop-b: 70%;
                --ef-reasoning-color-a: var(--ef-calib-y);
                --ef-reasoning-color-b: var(--ef-calib-c);
                --ef-reasoning-color-c: var(--ef-calib-m);
                animation-timing-function: cubic-bezier(0.25, 0.3, 0.65, 0.82);
                opacity: 0.92;
            }

            66.65% {
                --ef-reasoning-stop-a: 70%;
                --ef-reasoning-stop-b: 100%;
                --ef-reasoning-color-a: var(--ef-calib-y);
                --ef-reasoning-color-b: var(--ef-calib-c);
                --ef-reasoning-color-c: var(--ef-calib-m);
                animation-timing-function: steps(1, end);
                opacity: 0.92;
            }

            66.67% {
                --ef-reasoning-stop-a: 0%;
                --ef-reasoning-stop-b: 70%;
                --ef-reasoning-color-a: var(--ef-calib-m);
                --ef-reasoning-color-b: var(--ef-calib-y);
                --ef-reasoning-color-c: var(--ef-calib-c);
                animation-timing-function: cubic-bezier(0.25, 0.3, 0.65, 0.82);
                opacity: 0.92;
            }

            99.98% {
                --ef-reasoning-stop-a: 70%;
                --ef-reasoning-stop-b: 100%;
                --ef-reasoning-color-a: var(--ef-calib-m);
                --ef-reasoning-color-b: var(--ef-calib-y);
                --ef-reasoning-color-c: var(--ef-calib-c);
                animation-timing-function: steps(1, end);
                opacity: 0.92;
            }

            100% {
                --ef-reasoning-stop-a: 0%;
                --ef-reasoning-stop-b: 70%;
                --ef-reasoning-color-a: var(--ef-calib-c);
                --ef-reasoning-color-b: var(--ef-calib-m);
                --ef-reasoning-color-c: var(--ef-calib-y);
                opacity: 0.92;
            }
        }

        p {
            margin: 16px 0 0;
            color: #5f686a;
            font-size: 14px;
        }
    </style>
</head>
<body data-generating="true">
    <main id="chat">
        <article class="mes last_mes">
            <div class="mes_block">
                <details class="mes_reasoning_details" data-state="thinking">
                    <summary class="mes_reasoning_summary">// 正在解析</summary>
                </details>
                <p>同色不分段：左端拉伸至 70%，经过中段压缩后在右端快速收束为零。</p>
            </div>
        </article>
    </main>
</body>
</html>
