      <path d="M-1 1L1 -1M0 4L4 0M3 5L5 3" fill="none" stroke="#000" stroke-width=".85"/>
    </pattern>
    <g id="cell-solid"><use href="#body" fill="#000"/></g>
    <g id="cell-hatch"><use href="#body" fill="url(#hatch)"/></g>
    <g id="cell-double"><path d="M2.05 .5H8.5L21.5 13.5V19.95ZM.5 2.05V8.5L13.5 21.5H19.95Z" fill="#000"/></g>
  </defs>
