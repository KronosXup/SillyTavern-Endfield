<svg xmlns="http://www.w3.org/2000/svg" width="156" height="132" viewBox="0 0 156 132">
  <title>平面拼纹 · 少量变化</title>
  <desc>固定22像素模数、棋盘转向与1像素接缝。以实填与斜线的规律交替为主，仅4格实填替换为双带；单色平面，无透视和立体明暗。</desc>
  <defs>
    <path id="body" d="M.5 .5H8.5L21.5 13.5V21.5H13.5L.5 8.5Z"/>
